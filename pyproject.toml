[project]
name = "rtpm"
version = "0.1.0"
description = "Transcribe and speaker-label recorded thesis cluster student reviews"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.1",
    "pyannote.audio>=3.3",
    "torch",
    "torchaudio",
    "python-dotenv",
    "pyyaml",
    "huggingface-hub<1.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
