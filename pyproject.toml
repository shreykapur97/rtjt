[project]
name = "rtjt"
version = "0.1.0"
description = "Transcribe and speaker-label recorded thesis cluster student reviews"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.1",
    "pyannote.audio>=4.0",
    "torch~=2.8.0",
    "torchaudio~=2.8.0",
    "python-dotenv",
    "pyyaml",
    "huggingface-hub<1.0",
    "pymupdf>=1.28.2",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
