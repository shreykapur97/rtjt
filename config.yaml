# Default settings. Copy to config.local.yaml to override (gitignored).
whisper:
  model: large-v3
  device: cuda
  compute_type: float16
  language: en          # fixed language avoids mis-detection; null = auto-detect
  # Settings chosen by `python -m pipeline.evaluate` (2026-10-12: batched 3.0% WER vs 11-21% others)
  batched: true         # decode pause-separated chunks independently: no skipped speech
  batch_size: 8
  style_prompt: false   # "polished" prompt made Whisper smooth over / skip messy speech
  use_vocabulary: false # word lists below made Whisper insert them where not said
  condition_on_previous_text: true    # only used when batched: false
  # Word lists, only used when use_vocabulary: true.
  names: []             # people's names: set in config.local.yaml (private), not here
  terms: []             # thesis-specific words (topics, sites, places): config.local.yaml
  languages: []         # other-language words people mix in (e.g. Spanish "vale"): config.local.yaml
  vocabulary:
    - IAAC
    - thesis
    - masterplan
    - parametric
    - Grasshopper
    - Rhino
diarization:
  enabled: true
  model: pyannote/speaker-diarization-community-1
  exclusive: true      # true: one speaker at a time (community-1 only)
  min_speakers: null
  max_speakers: null
render:
  # "Ghost" speakers (noise, a cough read as a word) with this many words or fewer in the
  # whole recording are merged into the nearest real speaker. Keep low: brief real
  # interjections (finishing someone's sentence) should stay as their own speaker.
  ghost_max_words: 2
  paragraph_pause: 1.5       # seconds of silence that start a new paragraph
  paragraph_max_words: 120    # split long monologues at the next sentence end
  interjection_max_words: 3   # "yeah", "mm-hm" folded inline into the other speaker's turn
  interjection_max_seconds: 2.0
  marker_before: 30           # seconds highlighted before a Ctrl+M marker
  marker_after: 10            # seconds highlighted after it
eval:
  repeats: 2                  # Whisper varies run to run; repeat to see the spread
  change_tolerance: 3         # words either side that still count as a matching speaker change
  # Each preset is tried on every clip in data/eval. Options:
  #   style_prompt, vocabulary, batched (true/false); anything else overrides whisper settings
  presets:
    first_run:     {style_prompt: false, vocabulary: false, batched: false}
    vocabulary:    {style_prompt: false, vocabulary: true,  batched: false}
    current:       {style_prompt: true,  vocabulary: true,  batched: false}
    batched:       {style_prompt: false, vocabulary: false, batched: true}
    batched_vocab: {style_prompt: false, vocabulary: true,  batched: true}
paths:
  eval: data/eval
  recordings: data/raw_recordings
  presentations: data/presentations
  outputs: outputs
